name: CI

# Tests and a full build (programs and MSI packages) on every push and pull
# request. On a tag v* a separate job attaches the packages to the release.
#
# Supply chain (0.17.0): actions are pinned to full commit SHAs (the tag
# they were resolved from is in the comment), and only the release job, run
# for tags only, may write to the repository.
#
# Signatures (0.18.0): the release job signs the installers and SHA256SUMS
# with Sigstore (cosign, keyless: the certificate names this workflow and
# the tag). This proves where a file was built; it is not a Windows
# (Authenticode) signature.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./... -count=1 -timeout 10m
      # WireGuard tunnel tests skip themselves under the race detector
      # (KNOWN-ISSUES.md); everything else runs over plain TLS.
      - name: Test with the race detector
        run: go test -race ./... -count=1 -timeout 20m
      - name: Vet (code built for other systems, used by the tests)
        run: go vet ./...
      - name: Check that the Windows programs compile
        run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: Known vulnerabilities (the Windows programs and the test build)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          check="$(go env GOPATH)/bin/govulncheck"
          GOOS=windows GOARCH=amd64 "$check" ./...
          "$check" ./...
      - name: Install MSI tools
        run: sudo apt-get update && sudo apt-get install -y msitools wixl
      - name: Build
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./build.sh
          ls dist/*.msi   # fail if the packages were skipped
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slipdrukka-${{ github.sha }}
          path: dist/

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the packages
      id-token: write # Sigstore: a short-lived certificate for this workflow run
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: slipdrukka-${{ github.sha }}
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Only the two installers and their checksums: that is all anyone needs.
          # Versions 0.x are test releases.
          pre=""; case "$GITHUB_REF_NAME" in v0.*) pre="--prerelease";; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" $pre --title "SlipDrukka ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.msi dist/SHA256SUMS --clobber
      # After the upload: a signing failure leaves the release usable.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign with Sigstore
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for f in dist/*.msi dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          gh release upload "$GITHUB_REF_NAME" dist/*.sigstore.json --clobber
